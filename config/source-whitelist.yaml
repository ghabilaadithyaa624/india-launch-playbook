# ---------------------------------------------------------------------------
# EVIDENCE WHITELIST
#
# Agents may cite ONLY sources that appear in the generated source pack, and the
# pack is built ONLY from this whitelist plus operator-supplied documents.
#
# This is the single control that converts the system from "plausible text"
# into "defensible research". It is derived from
# reference/primary-source-reference-shelf.md, which until now was never
# consumed by any agent.
#
# Adding a domain here is a TRUST DECISION. Prefer primary regulators and
# official statistics. Never add a content farm or an SEO aggregator.
# ---------------------------------------------------------------------------

version: 1

# Only these hosts may ever be fetched by the evidence layer.
allowed_domains:
  - meity.gov.in            # Digital Personal Data Protection Act + Rules
  - trai.gov.in             # Commercial communications / DLT
  - rbi.org.in              # Payment aggregators, settlement systems
  - cert-in.org.in          # Cyber incident directions
  - mca.gov.in              # Company incorporation
  - gst.gov.in              # GST
  - udyamregistration.gov.in # MSME registration
  - ipindia.gov.in          # Trademarks
  - fssai.gov.in            # Food safety licensing
  - dgft.gov.in             # Import/export licensing
  - mospi.gov.in            # Ministry of Statistics (official statistics)
  - censusindia.gov.in      # Census
  - indiabudget.gov.in      # Union budget / economic survey
  - labour.gov.in           # Labour codes
  - epfindia.gov.in         # Provident fund
  - esic.gov.in             # Employee state insurance

# Curated entries. `url` is the stable landing page; the fetcher will not
# follow redirects off an allowed domain.
sources:
  - key: dpdp_act
    type: primary_regulator
    publisher: Ministry of Electronics and Information Technology (MeitY)
    title: Digital Personal Data Protection Act, 2023 and Rules
    url: https://www.meity.gov.in/
    topics: [privacy, data_protection, consent, regulatory_compliance]
    note: >
      Staged commencement. Determine which provisions apply on the planned
      launch date. Do not reproduce legacy "deadline" claims.

  - key: trai_dlt
    type: primary_regulator
    publisher: Telecom Regulatory Authority of India (TRAI)
    title: Commercial communications / DLT registration guidance
    url: https://trai.gov.in/
    topics: [messaging, sms, whatsapp, marketing, regulatory_compliance]

  - key: rbi_payments
    type: primary_regulator
    publisher: Reserve Bank of India (RBI)
    title: Payment and Settlement Systems — notifications and master directions
    url: https://www.rbi.org.in/
    topics: [payments, payment_aggregator, kyc, settlement, regulatory_compliance]

  - key: certin_directions
    type: primary_regulator
    publisher: Indian Computer Emergency Response Team (CERT-In)
    title: Directions and advisories on cyber incident reporting
    url: https://www.cert-in.org.in/
    topics: [security, incident_response, logging, regulatory_compliance]

  - key: mca_incorporation
    type: primary_regulator
    publisher: Ministry of Corporate Affairs (MCA)
    title: Company incorporation and post-incorporation compliance
    url: https://www.mca.gov.in/
    topics: [entity, incorporation, regulatory_compliance]

  - key: gst_portal
    type: primary_regulator
    publisher: Goods and Services Tax Network
    title: GST registration, returns and rates
    url: https://www.gst.gov.in/
    topics: [tax, gst, invoicing, regulatory_compliance]

  - key: udyam_msme
    type: primary_regulator
    publisher: Ministry of MSME
    title: Udyam registration for micro, small and medium enterprises
    url: https://udyamregistration.gov.in/
    topics: [entity, msme, regulatory_compliance]

  - key: ip_india
    type: primary_regulator
    publisher: Office of the Controller General of Patents, Designs and Trade Marks
    title: Trademark search and filing
    url: https://ipindia.gov.in/
    topics: [brand, trademark, ip, regulatory_compliance]

  - key: fssai
    type: primary_regulator
    publisher: Food Safety and Standards Authority of India (FSSAI)
    title: Food business licensing, labelling and claims
    url: https://www.fssai.gov.in/
    topics: [food, licensing, labelling, claims, regulatory_compliance]

  - key: dgft
    type: primary_regulator
    publisher: Directorate General of Foreign Trade (DGFT)
    title: Import/export policy and licensing
    url: https://www.dgft.gov.in/
    topics: [import, export, customs, supply_chain]

  - key: mospi
    type: government_statistics
    publisher: Ministry of Statistics and Programme Implementation (MoSPI)
    title: National accounts, consumption and household survey statistics
    url: https://www.mospi.gov.in/
    topics: [market_research, demographics, income, gdp, consumption]

  - key: census_india
    type: government_statistics
    publisher: Office of the Registrar General & Census Commissioner
    title: Census of India — population and urbanisation data
    url: https://censusindia.gov.in/
    topics: [market_research, demographics, urban_rural, population]

  - key: economic_survey
    type: government_statistics
    publisher: Government of India, Ministry of Finance
    title: Economic Survey and Union Budget documents
    url: https://www.indiabudget.gov.in/
    topics: [market_research, gdp, sector_policy, macro]

  - key: labour_codes
    type: primary_regulator
    publisher: Ministry of Labour and Employment
    title: Labour codes, wages and employment regulation
    url: https://labour.gov.in/
    topics: [hr, employment, wages, regulatory_compliance]

# Topic -> agent routing. Controls which slice of the pack each agent receives.
agent_topics:
  market_research:        [market_research, demographics, income, gdp, consumption, urban_rural, population, macro]
  regulatory_compliance:  [regulatory_compliance, privacy, data_protection, tax, gst, entity, incorporation, licensing, hr, employment, security]
  market_entry:           [entity, incorporation, import, export, sector_policy, regulatory_compliance]
  competitive_landscape:  [market_research, sector_policy]
  go_to_market:           [messaging, sms, whatsapp, marketing, payments, brand, trademark]
  financial_projections:  [tax, gst, payments, income, consumption, macro]
  risk_management:        [security, incident_response, regulatory_compliance, privacy, payments]
  implementation_roadmap: [entity, incorporation, licensing, regulatory_compliance]
